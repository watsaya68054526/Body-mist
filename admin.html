<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ | Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ส่วนเฉพาะหน้า admin (ไม่แก้ style.css) */
    .page-title { font-size: var(--fs-xl); font-weight: 400; }
    .table-wrap {
      overflow-x: auto;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    #ordersTable {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: var(--fs-sm);
    }
    #ordersTable th,
    #ordersTable td {
      padding: var(--sp-2) var(--sp-3);
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
      line-height: 1.7;
    }
    #ordersTable thead th {
      font-weight: 400;
      font-size: var(--fs-xs);
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      background: var(--cream);
      white-space: nowrap;
    }
    #ordersTable tbody tr:last-child td { border-bottom: 0; }
    #ordersTable td:first-child { white-space: nowrap; color: var(--ink-soft); }
    #ordersTable td:nth-child(5) { white-space: nowrap; color: var(--gold-deep); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">BODY SCENT</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__head">
          <h1 class="page-title">รายการสั่งซื้อ</h1>
          <p>คำสั่งซื้อล่าสุดแสดงก่อน</p>
          <span class="rule" aria-hidden="true"></span>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Body Scent. สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
